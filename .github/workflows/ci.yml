name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows runs alongside Linux: platform-specific breakage (encoding,
    # event-loop policy, console-script shims, path assumptions — #10) must
    # fail CI, not a user's workday.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # venv layout is Scripts\ on Windows, bin/ elsewhere; every step below
      # goes through this so the matrix stays uniform. matrix.os, not
      # runner.os: job-level env may not reference the runner context
      # (actions/runner#2204 — the whole workflow fails validation).
      VENV: ${{ matrix.os == 'windows-latest' && '.venv/Scripts' || '.venv/bin' }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ runner.os }}
      - name: Install
        run: |
          uv venv
          uv pip install -e ".[atlassian]" pytest
      - name: "[atlassian] resolves to upstream only"
        shell: bash
        run: |
          "$VENV/python" - <<'EOF'
          from importlib.metadata import PackageNotFoundError, distribution

          try:
              distribution("mcp-atlassian")
          except PackageNotFoundError:
              raise SystemExit(
                  "[atlassian] install lost upstream mcp-atlassian"
              )
          try:
              distribution("mcp-atlassian-with-bitbucket")
              raise SystemExit("[atlassian] install pulled the fork too")
          except PackageNotFoundError:
              pass
          EOF
      - name: Test
        shell: bash
        run: '"$VENV/python" -m pytest'
      - name: Smoke — console script + provider import, no credentials
        # Drives the installed entrypoint end-to-end on a clean environment:
        # on Windows this exercises the console-script shim, the provider's
        # SelectorEventLoop policy, and truststore injection — the import
        # path `atli tools` takes before any credentials exist (#10).
        shell: bash
        run: |
          out=$("$VENV/atli" tools); status=$?
          test "$status" -eq 0
          printf '%s' "$out" | grep -q "No services configured"
      - name: Smoke — stdout hardening under a hostile encoding
        # The no-services message contains an em-dash (U+2014), which latin-1
        # cannot encode — under PYTHONIOENCODING=latin-1 the print crashes
        # with UnicodeEncodeError unless _harden_stdout's backslashreplace is
        # in place. This pins the output-side half of #10 on every leg,
        # Windows or not (cp1252 alone would encode the em-dash and hide it).
        shell: bash
        run: |
          out=$(PYTHONIOENCODING=latin-1 "$VENV/atli" tools); status=$?
          test "$status" -eq 0
          printf '%s' "$out" | grep -q "No services configured"

  # pip-side verification of the provider contract: the base install carries
  # NO provider (inert by design), and each extra resolves to exactly its
  # provider. Verified with pip's own resolver in throwaway venvs.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bare install (pip) ships no provider
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install .
          /tmp/bare/bin/python - <<'EOF'
          from importlib.metadata import PackageNotFoundError, distribution

          for dist in ("mcp-atlassian", "mcp-atlassian-with-bitbucket"):
              try:
                  distribution(dist)
                  raise SystemExit(f"bare install pulled provider {dist}")
              except PackageNotFoundError:
                  pass
          EOF
      - name: "[atlassian] install (pip) resolves to upstream only"
        run: |
          python -m venv /tmp/upstream
          /tmp/upstream/bin/pip install ".[atlassian]"
          /tmp/upstream/bin/python - <<'EOF'
          from importlib.metadata import PackageNotFoundError, distribution

          try:
              distribution("mcp-atlassian")
          except PackageNotFoundError:
              raise SystemExit("[atlassian] did not install upstream")
          try:
              distribution("mcp-atlassian-with-bitbucket")
              raise SystemExit("[atlassian] pulled the fork too")
          except PackageNotFoundError:
              pass
          EOF
      - name: "[bitbucket] install (pip) resolves to the fork only"
        run: |
          python -m venv /tmp/fork
          /tmp/fork/bin/pip install ".[bitbucket]"
          /tmp/fork/bin/python - <<'EOF'
          from importlib.metadata import PackageNotFoundError, distribution

          try:
              distribution("mcp-atlassian-with-bitbucket")
          except PackageNotFoundError:
              raise SystemExit("[bitbucket] did not install the fork")
          try:
              distribution("mcp-atlassian")
              raise SystemExit("[bitbucket] installed upstream alongside the fork")
          except PackageNotFoundError:
              pass
          EOF

  # Fork leg: prove the whole CLI under mcp-atlassian-with-bitbucket and its
  # fastmcp 2.x. Provider drift failures get fixed in the TESTS (tolerate
  # both majors), never in production code — see the spec's shim philosophy.
  bitbucket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-suffix: bitbucket
      - name: Install with the fork provider
        run: |
          uv venv
          uv pip install -e ".[bitbucket]" pytest
      - name: Provider swap asserted (fork in, upstream out)
        run: |
          .venv/bin/python - <<'EOF'
          from importlib.metadata import PackageNotFoundError, distribution

          try:
              distribution("mcp-atlassian-with-bitbucket")
          except PackageNotFoundError:
              raise SystemExit("[bitbucket] install did not bring the fork")
          try:
              distribution("mcp-atlassian")
              raise SystemExit("upstream leaked into the [bitbucket] install")
          except PackageNotFoundError:
              pass
          EOF
      - name: Test
        run: .venv/bin/python -m pytest
      - name: Smoke — no credentials configured
        run: |
          out=$(.venv/bin/atli tools); status=$?
          test "$status" -eq 0
          printf '%s' "$out" | grep -q "No services configured"
          printf '%s' "$out" | grep -q "BITBUCKET_URL"
          out=$(.venv/bin/atli prime); status=$?
          test "$status" -eq 0
          test -z "$out"
