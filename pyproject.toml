[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-atlassian-cli"
dynamic = ["version"]
description = "atli - a CLI for Jira and Confluence, powered by mcp-atlassian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp-atlassian>=0.23,<0.24",
    "cyclopts>=4.22,<5",
]

[project.scripts]
atli = "mcp_atlassian_cli.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

# Single source of truth for the version is __version__ in
# src/mcp_atlassian_cli/__init__.py; the release workflow checks the pushed
# tag against it (release.yml, "Version guard" step).
[tool.setuptools.dynamic]
version = {attr = "mcp_atlassian_cli.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
