[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-atlassian-cli"
dynamic = ["version"]
description = "atli - a CLI for Jira and Confluence, powered by mcp-atlassian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # No provider in the base install: pip's resolver cannot suppress a base
    # dependency for an extra (it evaluates base deps with extra="" even when
    # resolving pkg[extra]), so "upstream unless [bitbucket]" is unexpressible
    # and the marker variant shipped broken. The provider comes from an extra:
    # [atlassian] = upstream (Jira+Confluence), [bitbucket] = the fork.
    "cyclopts>=4.22,<5",
    # Interactive prompts for `atli init` (arrow-key selects; dormant but
    # stable — the wizard's prompt surface is small and empirically verified
    # against prompt_toolkit 3.0.x in the pty smoke tests).
    "InquirerPy>=0.3.4,<0.4",
    # Round-trip TOML editing for `atli init`: parses, mutates, and re-serializes
    # the user's config while preserving comments and key order.
    "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
atlassian = ["mcp-atlassian>=0.23,<0.24"]
bitbucket = ["mcp-atlassian-with-bitbucket>=1.0.5,<1.1"]

[project.scripts]
atli = "mcp_atlassian_cli.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

# Single source of truth for the version is __version__ in
# src/mcp_atlassian_cli/__init__.py; the release workflow checks the pushed
# tag against it (release.yml, "Version guard" step).
[tool.setuptools.dynamic]
version = {attr = "mcp_atlassian_cli.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
